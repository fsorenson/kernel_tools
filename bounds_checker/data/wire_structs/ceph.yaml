# Ceph messenger/protocol receive structs
#
# TEMPLATE — types are commented out because Ceph size guards use a macro
# idiom that the scanner cannot yet recognise:
#
#   ceph_decode_need(&p, end, sizeof(*hdr2), bad);
#   hdr2 = p;
#   seq = le64_to_cpu(hdr2->seq);   ← Cat I fires (macro guard invisible)
#
# Enabling these types produces false positives for every properly-guarded
# Ceph receive path.  Uncomment after implementing macro-guard recognition
# in _has_sizeof_guard (see "Known guard gaps" in CLAUDE.md).
#
# Historical confirmed instance: net/ceph/messenger_v2.c, fixed upstream
# commit 69fb5d91bba4 (2026-03-08) by adding ceph_decode_need() before
# the ceph_msg_header2 field reads.

protocol: Ceph
subsystem: net/ceph

response_structs: {}

# Uncomment when macro guards are supported:
# response_structs:
#   ceph_msg_header2:   0   # v2 messenger frame header; always received
#   ceph_msg_header:    0   # v1 header (fill_header reads it from received data)
#   ceph_mds_reply_head: 0  # MDS reply; needs size audit

dual_use_sizes: {}

dual_use: []
